services:
  - type: web
    name: wal-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ETHERSCAN_API_KEY
        sync: false
      - key: DEBANK_ACCESS_KEY
        sync: false
