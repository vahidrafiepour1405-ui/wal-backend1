name: Test and deploy WAL web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="fa" dir="rtl">' in html
          assert "<script>" in html and "</script>" in html
          assert "market.js?v=1" in html
          assert 'id="pairs"' in html and 'id="refresh"' in html
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          Path("wal-inline.js").write_text(scripts[0], encoding="utf-8")
          print("HTML smoke checks passed")
          PY
          node --check wal-inline.js
          node --check market.js
      - name: Validate backend syntax
        run: |
          python -m py_compile backend/main.py
      - name: Check API dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          req = Path("backend/requirements.txt").read_text()
          assert "fastapi" in req and "httpx" in req and "uvicorn" in req
          print("Backend dependency manifest passed")
          PY
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
