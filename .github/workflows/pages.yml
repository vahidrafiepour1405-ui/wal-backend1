name: Test and deploy WAL web app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="fa" dir="rtl">' in html, "Persian RTL document tag missing"
          assert html.count("<script>") == 1 and html.count("</script>") == 1, "Expected one inline script"
          assert 'id="pairs"' in html and 'id="refresh"' in html, "Required UI controls missing"
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          Path("wal-inline.js").write_text(scripts[0], encoding="utf-8")
          print("HTML smoke checks passed")
          PY
          node --check wal-inline.js
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
